name: Add submodule

on:
  workflow_dispatch:        # Uruchomienie ręczne z poziomu GitHub UI
  # push:                   # Opcjonalnie: automatycznie przy pushu (odkomentuj)

jobs:
  add-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add submodule
        run: |
          # Usuń starą ścieżkę jeśli istnieje (opcjonalnie, aby uniknąć konfliktów)
          rm -rf external/samloader || true
          git rm --cached external/samloader 2>/dev/null || true
          # Dodaj submoduł
          git submodule add --force https://github.com/ananjaser1211/samloader.git external/samloader
          # Zainicjuj i zaktualizuj
          git submodule update --init --recursive

      - name: Commit and push changes
        run: |
          git add .gitmodules external/samloader
          git commit -m "Add samloader submodule" || echo "No changes to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
