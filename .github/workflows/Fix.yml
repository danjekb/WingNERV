name: Remove orphaned submodule gitlink

on:
  workflow_dispatch:

jobs:
  remove-gitlink:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (without submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          ref: fifteen

      - name: Remove orphaned submodule (gitlink + directory)
        run: |
          # Remove the gitlink from the index (staged as a submodule)
          git rm --cached external/samfwdl 2>/dev/null || true

          # Delete the actual folder if it exists
          rm -rf external/samfwdl

          # Also remove any leftover .gitmodules entry (just in case)
          git config -f .gitmodules --remove-section "submodule.external/samfwdl" 2>/dev/null || true

          # Stage the removal of .gitmodules if changed
          git add .gitmodules 2>/dev/null || true

          # Stage the directory removal (git rm already staged it)
          # Also stage deletion of empty parent dirs (optional)
          git add external 2>/dev/null || true

      - name: Commit and push fix
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git commit -m "Remove orphaned submodule gitlink for samfwdl" || echo "No changes to commit"
          git push origin HEAD:fifteen
